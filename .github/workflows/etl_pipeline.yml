name: ETL Data Warehouse Refresh

on:
  schedule:
    - cron: '0 22 * * *'
  
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'etl/**'
      - '.github/workflows/etl_pipeline.yml'

jobs:
  run-etl-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ETL dependencies
        working-directory: ./etl
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for data changes
        working-directory: ./etl
        id: check_changes
        run: |
          echo "Checking for new data files..."
          if [ -d "data" ]; then
            echo "data_files_count=$(find data -type f | wc -l)" >> $GITHUB_OUTPUT
          else
            echo "data_files_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Run ETL Pipeline
        working-directory: ./etl  
        env:

          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}

        run: |
          echo "Starting ETL pipeline..."
          python -m pipelines.full_refresh  

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: etl-failure-logs
          path: |
            etl/**/*.log
            etl/**/*.csv
            etl/data/**/*.csv
          retention-days: 7

      - name: Send notification on failure (fallback)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_HOST }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_SENDER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "ETL Pipeline Failed - ${{ github.run_number }}"
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: ${{ secrets.EMAIL_SENDER }}
          body: |
            The ETL pipeline failed.
            
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            Commit: ${{ github.sha }}

            See logs:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
